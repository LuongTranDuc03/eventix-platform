worker_processes auto;

events {
    worker_connections 20480;
    multi_accept on;
}

http {
    # Tắt ghi log từng request khi load test để giải phóng 100% I/O ổ đĩa
    access_log off;
    error_log /var/log/nginx/error.log crit;

    upstream eventix_backend {
        server app-1:8080;
        server app-2:8080;
        keepalive 1024; # Tăng từ 64 lên 1024 kết nối mở sẵn
    }

    server {
        listen 80;

        location / {
            proxy_pass http://eventix_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Tối ưu buffer phản hồi
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 32k;
        }
    }
}