version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: eventix-postgres
    restart: "no"
    environment:
      POSTGRES_DB: eventix_db
      POSTGRES_USER: eventix_admin
      POSTGRES_PASSWORD: eventix_secret_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - eventix-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U eventix_admin -d eventix_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eventix-redis
    restart: "no"
    command: redis-server --requirepass eventix_redis_password --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - eventix-network
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "eventix_redis_password", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: heidiks/rabbitmq-delayed-message-exchange:3.13-management
    container_name: eventix-rabbitmq
    restart: "no"
    environment:
      RABBITMQ_DEFAULT_USER: eventix_rabbit
      RABBITMQ_DEFAULT_PASS: eventix_rabbit_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - eventix-network
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_running" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Instance 1
  app-1:
    build: .
    container_name: eventix-app-1
    restart: "no"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/eventix_db
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PASSWORD=eventix_redis_password
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=eventix_rabbit
      - SPRING_RABBITMQ_PASSWORD=eventix_rabbit_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - eventix-network

  # Spring Boot Instance 2 (Nhân bản để test Load Balancer)
  app-2:
    build: .
    container_name: eventix-app-2
    restart: "no"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/eventix_db
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PASSWORD=eventix_redis_password
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=eventix_rabbit
      - SPRING_RABBITMQ_PASSWORD=eventix_rabbit_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - eventix-network

  # Nginx Load Balancer đứng trước phân phối tải
  nginx:
    image: nginx:alpine
    container_name: eventix-nginx
    restart: "no"
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app-1
      - app-2
    networks:
      - eventix-network

networks:
  eventix-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
